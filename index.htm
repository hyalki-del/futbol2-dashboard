
<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Cup 2026 AI Analyst v3</title>
<style>
body{margin:0;background:#0a0f1c;color:#fff;font-family:Arial}
header{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,#200,#b00,#200);padding:15px;text-align:center}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
button{padding:12px 18px;border:0;border-radius:12px;cursor:pointer}
.primary{background:#d00;color:#fff}.secondary{background:#333;color:#fff}
#bar{position:sticky;top:90px;background:#111;padding:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px;padding:20px}
.card,.pred{background:#151c2d;border-radius:16px;padding:15px;cursor:pointer;transition:.3s}
.card:hover,.pred:hover{transform:translateY(-5px)}
.sel{outline:2px solid gold}
.hidden{display:none}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center}
.box{width:min(850px,92%);max-height:85vh;overflow:auto;background:#111;padding:22px;border-radius:18px}
.fade{animation:f .4s}@keyframes f{from{opacity:0;transform:translateY(15px)}to{opacity:1}}
</style></head><body>
<header>
<h1>🏆 World Cup 2026 AI Analyst</h1>
<div class="controls">
<button class="primary" onclick="showPredictions()">Tahminleri Göster</button>
<button class="secondary" onclick="newPredictions()">Yeni Rastgele Tahminler</button>
<button class="secondary" onclick="location.reload()">Sıfırla</button>
</div></header>
<div id="bar"><b>Seçilen Maçlar:</b> <span id="chosen">Yok</span></div>
<div id="home"><div class="cards" id="cards"></div></div>
<div id="predictions" class="hidden"></div>

<div id="modal" class="modal" onclick="closeModal()">
<div class="box fade" onclick="event.stopPropagation()">
<h2>AI Analiz Raporu</h2>
<div id="detail"></div><br>
<button class="primary" onclick="closeModal()">Kapat</button>
</div></div>

<script>
const matches=[
["Brezilya","Fas"],["Türkiye","Avustralya"],["İngiltere","Hırvatistan"],
["Almanya","Curaçao"],["Fransa","Senegal"],["Arjantin","Cezayir"]
];
let selected=[],stored=[];

matches.forEach((m,i)=>{
 let d=document.createElement("div");
 d.className="card";
 d.innerHTML=`<h3>${m[0]}</h3><p>vs</p><h3>${m[1]}</h3>`;
 d.onclick=()=>{
  d.classList.toggle("sel");
  selected.includes(i)?selected=selected.filter(x=>x!==i):selected.push(i);
  chosen.textContent=selected.length?selected.map(x=>matches[x].join(" - ")).join(" | "):"Yok";
 };
 cards.appendChild(d);
});

const starters=[
"Orta saha kontrolünün maçın ilk bölümünde belirleyici olacağı varsayıldı.",
"Simülasyonlarda pres yoğunluğu erken bölümde önemli fark yarattı.",
"Topa sahip olma üstünlüğünün oyunun ritmini şekillendirmesi bekleniyor.",
"Geçiş hücumları modelde kritik üretim kaynağı olarak öne çıktı."
];

function rnd(a){return a[Math.floor(Math.random()*a.length)]}

function generate(m){
 let iyh=Math.floor(Math.random()*3), iya=Math.floor(Math.random()*3);
 let syh=Math.floor(Math.random()*3), sya=Math.floor(Math.random()*3);
 let home=iyh+syh, away=iya+sya;
 let ms=home>away?"1":home<away?"2":"X";

 let firstHalf=`${rnd(starters)} İlk yarı senaryolarının önemli bölümünde ${m[0]} ile ${m[1]} arasındaki mücadelede merkez bölgelerde yoğun temas görüldü. Erken bir gol ihtimali oyunun dengesini değiştirebilecek temel unsur olarak değerlendirildi.`;

 let secondHalf=`İkinci yarı modelinde 60. dakikadan sonra oyuncu enerjisinin ve kulübe katkısının etkisi artırıldı. Bu nedenle son bölümde oyunun daha açık hale gelmesi ve savunma hatalarının gol olasılığını yükseltmesi bekleniyor.`;

 let matchResult=`Maç sonucu tahmini oluşturulurken skor üretimi, oyun kontrolü ve psikolojik momentum birlikte değerlendirildi. Simülasyonların çoğunda ortaya çıkan ortak eğilim '${ms}' sonucunu destekledi, ancak tek bir kritik pozisyon tüm senaryoyu değiştirebilir.`;

 let risk=`Risk faktörleri arasında duran toplar, bireysel savunma hataları, hakem kararları ve erken kartlar bulunuyor. Özellikle ilk golü atan tarafın oyunu yönetme ihtimali belirgin şekilde yükseliyor.`;

 let confidence=Math.floor(55+Math.random()*35);

 return {
  iy:`${iyh}-${iya}`,
  sy:`${syh}-${sya}`,
  ms,
  confidence,
  fav:Math.random()>.5?"⭐ Favori":"🔥 Sürpriz",
  report:`
  <h3>İlk Yarı Analizi</h3><p>${firstHalf}</p>
  <h3>İkinci Yarı Analizi</h3><p>${secondHalf}</p>
  <h3>Maç Sonucu Analizi</h3><p>${matchResult}</p>
  <h3>Risk Değerlendirmesi</h3><p>${risk}</p>
  <h3>AI Güven Seviyesi</h3><p>%${confidence}</p>`
 };
}

function render(){
 predictions.innerHTML="<h2 style='padding:20px'>Tahminler (Detay için tıkla)</h2>";
 stored.forEach((p,i)=>{
  let d=document.createElement("div");
  d.className="pred fade";
  d.innerHTML=`<h3>${matches[selected[i]][0]} vs ${matches[selected[i]][1]}</h3>
  <p>${p.fav}</p>
  <p><b>İlk Yarı:</b> ${p.iy}</p>
  <p><b>İkinci Yarı:</b> ${p.sy}</p>
  <p><b>Maç Sonucu:</b> ${p.ms}</p>
  <p><b>Güven:</b> %${p.confidence}</p>`;
  d.onclick=()=>{detail.innerHTML=p.report;modal.style.display='flex';};
  predictions.appendChild(d);
 });
}
function showPredictions(){
 if(!selected.length){alert("Maç seçiniz");return;}
 home.classList.add("hidden");
 predictions.classList.remove("hidden");
 stored=selected.map(i=>generate(matches[i]));
 render();
}
function newPredictions(){
 if(!selected.length)return;
 stored=selected.map(i=>generate(matches[i]));
 if(!predictions.classList.contains("hidden")) render();
}
function closeModal(){modal.style.display='none';}
</script></body></html>
