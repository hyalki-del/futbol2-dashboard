<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F2 // ANALYTICAL PREDICTION MATRIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; background-color: #030712; }
        .glow-green { box-shadow: 0 0 15px rgba(16, 185, 129, 0.15); }
        .glow-amber { box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }
        .surprise-flash { animation: flash-intel 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes flash-intel {
            0% { background-color: rgba(245, 158, 11, 0.25); border-left-color: #f59e0b; }
            100% { background-color: rgba(245, 158, 11, 0.02); }
        }
    </style>
</head>
<body class="text-slate-300 min-h-screen selection:bg-emerald-500 selection:text-slate-950 p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">

        <!-- SYSTEM HEADER -->
        <div class="border border-slate-800 bg-slate-900/40 backdrop-blur p-6 rounded-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-6 glow-green">
            <div class="space-y-1">
                <div class="flex items-center space-x-3">
                    <div class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></div>
                    <h1 class="text-lg font-bold tracking-wider text-white">FUTBOL 2 // PREDICTION CORE v2.6</h1>
                </div>
                <div class="text-xs text-slate-500 flex items-center space-x-4">
                    <span>SYS_STATUS: ACTIVE</span>
                    <span>|</span>
                    <span id="sys-mode">MODE: RATIONAL_MATRIX</span>
                </div>
            </div>

            <!-- CONTROLLER BUTTON -->
            <button id="btn-surprise" onclick="triggerSurpriseEngine()" class="bg-transparent border border-amber-500/40 text-amber-400 hover:bg-amber-500 hover:text-slate-950 font-bold tracking-widest text-xs px-5 py-3 rounded-lg transition-all duration-200 cursor-pointer uppercase glow-amber flex items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                <span>[ EXECUTE_SURPRISE_SIM ]</span>
            </button>
        </div>

        <!-- MATRIX DATA TABLE -->
        <div class="border border-slate-800 bg-slate-900/20 rounded-xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="border-b border-slate-800 bg-slate-950/60 text-slate-500 uppercase tracking-wider">
                            <th class="p-4 font-semibold text-center w-16">GRP</th>
                            <th class="p-4 font-semibold w-24">DATE</th>
                            <th class="p-4 font-semibold">MATCH MATCH-UP</th>
                            <th class="p-4 font-semibold text-center w-28">HALF TIME</th>
                            <th class="p-4 font-semibold text-center w-24">PRED_SCORE</th>
                            <th class="p-4 font-semibold text-center w-20">RES</th>
                            <th class="p-4 font-semibold text-center w-24">SIG_TYPE</th>
                        </tr>
                    </thead>
                    <tbody id="matrix-rows" class="divide-y divide-slate-800/40 font-medium">
                        <!-- Data injected dynamic -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- SYSTEM FOOTER SYSTEM -->
        <div class="flex justify-between items-center text-[10px] text-slate-600 tracking-widest px-2">
            <span>DATA_LOAD: 24_NODES_PROCESSED</span>
            <span>SECURE_CONNECTION // CORRELATION_ENGINE</span>
        </div>
    </div>

    <script>
        const dataset = [
            { id: 1, g: "A", d: "11.06", h: "Meksika", a: "Güney Afrika", rat: { s: "2-1", ht: "1-0", r: "1", t: "NORM" }, sur: { s: "1-1", ht: "0-1", r: "X", t: "ANOM" } },
            { id: 2, g: "A", d: "11.06", h: "Güney Kore", a: "Çekya", rat: { s: "1-1", ht: "0-0", r: "X", t: "NORM" }, sur: { s: "1-2", ht: "1-1", r: "2", t: "ANOM" } },
            { id: 3, g: "B", d: "12.06", h: "Kanada", a: "Bosna Hersek", rat: { s: "2-0", ht: "1-0", r: "1", t: "NORM" }, sur: { s: "1-1", ht: "0-0", r: "X", t: "ANOM" } },
            { id: 4, g: "B", d: "13.06", h: "Katar", a: "İsviçre", rat: { s: "0-2", ht: "0-1", r: "2", t: "NORM" }, sur: { s: "1-1", ht: "1-0", r: "X", t: "ANOM" } },
            { id: 5, g: "C", d: "13.06", h: "Haiti", a: "İskoçya", rat: { s: "1-2", ht: "0-1", r: "2", t: "NORM" }, sur: { s: "2-2", ht: "1-1", r: "X", t: "ANOM" } },
            { id: 6, g: "C", d: "13.06", h: "Brezilya", a: "Fas", rat: { s: "2-1", ht: "1-1", r: "1", t: "NORM" }, sur: { s: "1-2", ht: "1-0", r: "2", t: "ANOM" } },
            { id: 7, g: "D", d: "12.06", h: "ABD", a: "Paraguay", rat: { s: "2-0", ht: "0-0", r: "1", t: "NORM" }, sur: { s: "0-1", ht: "0-1", r: "2", t: "ANOM" } },
            { id: 8, g: "D", d: "14.06", h: "Avustralya", a: "Türkiye", rat: { s: "1-2", ht: "0-1", r: "2", t: "NORM" }, sur: { s: "2-2", ht: "2-0", r: "X", t: "ANOM" } },
            { id: 9, g: "E", d: "14.06", h: "Almanya", a: "Curaçao", rat: { s: "4-0", ht: "2-0", r: "1", t: "NORM" }, sur: { s: "2-1", ht: "0-0", r: "1", t: "ANOM" } },
            { id: 10, g: "E", d: "14.06", h: "Fildişi Sahili", a: "Ekvador", rat: { s: "1-1", ht: "1-0", r: "X", t: "NORM" }, sur: { s: "1-2", ht: "0-1", r: "2", t: "ANOM" } },
            { id: 11, g: "F", d: "14.06", h: "Hollanda", a: "Japonya", rat: { s: "2-2", ht: "1-1", r: "X", t: "NORM" }, sur: { s: "1-2", ht: "1-0", r: "2", t: "ANOM" } },
            { id: 12, g: "F", d: "15.06", h: "İsveç", a: "Tunus", rat: { s: "2-1", ht: "1-0", r: "1", t: "NORM" }, sur: { s: "0-0", ht: "0-0", r: "X", t: "ANOM" } },
            { id: 13, g: "G", d: "15.06", h: "İran", a: "Yeni Zelanda", rat: { s: "1-0", ht: "0-0", r: "1", t: "NORM" }, sur: { s: "1-1", ht: "1-0", r: "X", t: "ANOM" } },
            { id: 14, g: "G", d: "15.06", h: "Belçika", a: "Mısır", rat: { s: "2-1", ht: "1-1", r: "1", t: "NORM" }, sur: { s: "1-2", ht: "0-1", r: "2", t: "ANOM" } },
            { id: 15, g: "H", d: "15.06", h: "İspanya", a: "Yeşil Burun Ad.", rat: { s: "3-0", ht: "1-0", r: "1", t: "NORM" }, sur: { s: "1-1", ht: "0-0", r: "X", t: "ANOM" } },
            { id: 16, g: "H", d: "15.06", h: "Suudi Arabistan", a: "Uruguay", rat: { s: "0-2", ht: "0-1", r: "2", t: "NORM" }, sur: { s: "1-1", ht: "1-0", r: "X", t: "ANOM" } },
            { id: 17, g: "I", d: "16.06", h: "Fransa", a: "Senegal", rat: { s: "2-0", ht: "1-0", r: "1", t: "NORM" }, sur: { s: "1-1", ht: "0-1", r: "X", t: "ANOM" } },
            { id: 18, g: "I", d: "16.06", h: "Irak", a: "Norveç", rat: { s: "0-3", ht: "0-2", r: "2", t: "NORM" }, sur: { s: "1-2", ht: "1-0", r: "2", t: "ANOM" } },
            { id: 19, g: "J", d: "16.06", h: "Arjantin", a: "Cezayir", rat: { s: "3-1", ht: "2-0", r: "1", t: "NORM" }, sur: { s: "2-2", ht: "1-1", r: "X", t: "ANOM" } },
            { id: 20, g: "J", d: "16.06", h: "Avusturya", a: "Ürdün", rat: { s: "2-0", ht: "1-0", r: "1", t: "NORM" }, sur: { s: "1-1", ht: "0-0", r: "X", t: "ANOM" } },
            { id: 21, g: "K", d: "17.06", h: "Portekiz", a: "Kongo DC", rat: { s: "3-1", ht: "1-1", r: "1", t: "NORM" }, sur: { s: "2-2", ht: "1-2", r: "X", t: "ANOM" } },
            { id: 22, g: "K", d: "17.06", h: "Özbekistan", a: "Kolombiya", rat: { s: "0-2", ht: "0-1", r: "2", t: "NORM" }, sur: { s: "1-1", ht: "1-0", r: "X", t: "ANOM" } },
            { id: 23, g: "L", d: "17.06", h: "Gana", a: "Panama", rat: { s: "2-1", ht: "1-0", r: "1", t: "NORM" }, sur: { s: "1-2", ht: "0-1", r: "2", t: "ANOM" } },
            { id: 24, g: "L", d: "17.06", h: "İngiltere", a: "Hırvatistan", rat: { s: "1-1", ht: "0-0", r: "X", t: "NORM" }, sur: { s: "1-2", ht: "1-0", r: "2", t: "ANOM" } }
        ];

        function renderMatrix(surpriseIds = []) {
            const tbody = document.getElementById("matrix-rows");
            tbody.innerHTML = "";

            dataset.forEach(node => {
                const isSurprise = surpriseIds.includes(node.id);
                const data = isSurprise ? node.sur : node.rat;

                const row = document.createElement("tr");
                row.id = `node-${node.id}`;
                row.className = `transition-all duration-300 hover:bg-slate-800/40 border-b border-slate-900 ${isSurprise ? 'bg-amber-500/[0.02] text-amber-400 border-l border-l-amber-500 surprise-flash' : 'text-slate-300'}`;

                let resBadge = "border-slate-800 text-slate-400";
                if(data.r === "1") resBadge = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                else if(data.r === "X") resBadge = "bg-blue-500/10 text-blue-400 border-blue-500/20";
                else if(data.r === "2") resBadge = "bg-purple-500/10 text-purple-400 border-purple-500/20";

                let typeBadge = isSurprise
                    ? "bg-amber-500/10 text-amber-500 border-amber-500/20"
                    : "bg-slate-800/50 text-slate-500 border-slate-700/30";

                row.innerHTML = `
                    <td class="p-4 font-bold text-slate-500 text-center">${node.g}</td>
                    <td class="p-4 text-slate-500 font-mono">${node.d}</td>
                    <td class="p-4 font-medium tracking-wide">
                        <span class="text-white">${node.h}</span>
                        <span class="text-slate-600 mx-1">/</span>
                        <span class="text-slate-400">${node.a}</span>
                    </td>
                    <td class="p-4 text-center text-slate-400 font-mono">${data.ht}</td>
                    <td class="p-4 text-center font-bold font-mono tracking-widest ${isSurprise ? 'text-amber-400' : 'text-emerald-400'}">${data.s}</td>
                    <td class="p-4 text-center">
                        <span class="px-2 py-0.5 rounded border text-[11px] font-bold ${resBadge}">${data.r}</span>
                    </td>
                    <td class="p-4 text-center">
                        <span class="px-2 py-0.5 rounded text-[10px] border tracking-wider font-bold ${typeBadge}">${data.t}</span>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function triggerSurpriseEngine() {
            const size = dataset.length;
            const targetCount = Math.floor(size * 0.50);

            const randomPool = dataset.map(m => m.id).sort(() => 0.5 - Math.random());
            const activeSurprises = randomPool.slice(0, targetCount);

            renderMatrix(activeSurprises);

            document.getElementById("sys-mode").innerText = "MODE: HYBRID_ANOMALY_MATRIX (50%)";
            document.getElementById("sys-mode").className = "text-amber-400";
        }

        window.onload = function() {
            renderMatrix();
        };
    </script>
</body>
</html>
